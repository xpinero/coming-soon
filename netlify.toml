[build]
  command = "mkdir -p dist && cp index.html style.css script.js dist/ && cp -r img dist/"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!shop' ':!shop/**'"

[[redirects]]
  from = "/shop"
  to = "https://shop.xaverpinero.com/"
  status = 301
  force = true

[[redirects]]
  from = "/shop/*"
  to = "https://shop.xaverpinero.com/:splat"
  status = 301
  force = true
